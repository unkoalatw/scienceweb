<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Science | 科普小站</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

    <style>
        :root { --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; overflow-x: hidden; }

        /* 閱讀進度條 */
        #progress-bar { 
            height: 4px; 
            background: linear-gradient(to right, #6366f1, #3b82f6); 
            position: fixed; 
            top: 0; left: 0; 
            z-index: 9999; 
            width: 0%;
            transition: width 0.1s; 
        }

        #app-root { min-height: 80vh; padding-top: 1rem; transition: all 0.3s ease; }

        /* 全螢幕模式樣式 */
        #app-root.full-width-mode {
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100vw !important;
        }

        /* 骨架屏 */
        .skeleton-card { background: #f1f5f9; border-radius: 2rem; height: 360px; position: relative; overflow: hidden; }
        .skeleton-card::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: slide 1.5s infinite;
        }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .article-card { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .article-card:hover { transform: translateY(-8px); box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.12); }
        
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 內容樣式 */
        .article-content canvas { 
            display: block !important; width: 100% !important; height: auto !important; 
            min-height: 300px; margin: 2.5rem 0 !important; background: #fff;
            border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .article-content img { border-radius: 2.5rem !important; margin: 3rem auto !important; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1) !important; }

        .prose { max-width: none !important; color: #334155 !important; }
        .prose h1 { font-weight: 900 !important; font-size: 2.75rem !important; line-height: 1.15 !important; color: #0f172a !important; margin-bottom: 0.5em !important; }
        
        .tag-pill { transition: all 0.3s ease; white-space: nowrap; cursor: pointer; }
        .tag-pill.active { background: #6366f1; color: white; border-color: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* 回頂部按鈕 */
        #back-to-top { 
            position: fixed; bottom: 2rem; right: 2rem; 
            z-index: 5000; padding: 1.2rem; 
            background: #6366f1; color: white; 
            border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; pointer-events: none; transform: translateY(50px);
        }
        #back-to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #back-to-top:hover { background: #4f46e5; transform: scale(1.1); }

        /* Iframe 隔離模式樣式 */
        .isolated-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #fff;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100">
    <div id="progress-bar"></div>

    <!-- 導航欄 -->
    <nav id="main-nav" class="bg-white/90 backdrop-blur-xl sticky top-0 z-[1000] border-b border-slate-200 transition-transform duration-300">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="resetAndHome()">
                <div class="p-2 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl shadow-md group-hover:rotate-6 transition-transform">
                    <i data-lucide="microscope" class="w-6 h-6 text-white"></i>
                </div>
                <div class="flex flex-col text-left">
                    <span class="font-black text-xl tracking-tight leading-none text-slate-900">Daily Science</span>
                    <span class="text-[9px] uppercase tracking-[0.3em] text-indigo-500 font-bold mt-1 text-left">Scientific Insights</span>
                </div>
            </div>
            
            <div class="relative w-full md:max-w-xs">
                <input type="text" id="search-input" oninput="debouncedSearch(this.value)" placeholder="搜尋標題、內容或標籤..." 
                       class="w-full bg-slate-100 border-none rounded-xl py-2.5 px-10 text-sm outline-none focus:ring-2 focus:ring-indigo-500/50">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            </div>
        </div>
        <div id="tag-bar" class="max-w-6xl mx-auto px-4 py-2 border-t border-slate-50 flex items-center gap-2 overflow-x-auto no-scrollbar">
            <!-- JS 生成 -->
        </div>
    </nav>

    <!-- 主內容區塊 -->
    <main id="app-root" class="max-w-6xl mx-auto p-4 md:p-10 mt-2 relative min-h-screen">
        <div class="grid gap-10 md:grid-cols-2 lg:grid-cols-3">
            <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card hidden md:block"></div>
        </div>
    </main>

    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="回到頂部">
        <i data-lucide="arrow-up" class="w-6 h-6"></i>
    </button>

    <footer id="main-footer" class="py-24 text-center text-slate-400 text-xs border-t border-slate-200 mt-20 bg-white">
        <p class="font-bold text-slate-500 tracking-[0.3em] uppercase mb-2 italic">Curiosity is the engine of science</p>
        <p>&copy; 2025 Daily Science. All rights reserved.</p>
    </footer>

    <script>
        // 請確認這裡是你的最新 API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbyCmkbP9rYgjTbOVDfFWDzYz1K9yQZeXgR6Q_k71WhHaVn2ppWQh9KPfXXDY3GD4aY/exec";
        
        // 網站首頁網址 (用於分享連結)
        const SITE_URL = "https://unkoalatw.github.io/scienceweb";

        let articles = [];
        let isSearching = false;
        let selectedTag = null;
        let searchTimer = null;

        (function init() {
            const cachedData = localStorage.getItem('ds_data_v29');
            if (cachedData) {
                articles = JSON.parse(cachedData);
                renderHome();
                renderTagCloud();
            }
            fetchLatest();
            setupScrollEvents();
            if(window.lucide) lucide.createIcons();
        })();

        async function fetchLatest() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                if (json.status === 'success') {
                    articles = json.data;
                    localStorage.setItem('ds_data_v29', JSON.stringify(articles));
                    if (!isSearching && !selectedTag && !document.querySelector('.article-mode')) {
                        renderHome();
                        renderTagCloud();
                    }
                }
            } catch (e) { console.warn("API 離線中"); }
        }

        // [極速核心] 圖片加速與 GitHub Raw 轉換
        function optimizeImageUrl(url, width = 800) {
            if (!url) return '';
            
            // 1. 清理 URL
            let cleanUrl = url.trim();
            
            // 2. 處理 GitHub 一般網址 (github.com/.../blob/...) -> 轉為 raw 格式
            if (cleanUrl.includes('github.com') && cleanUrl.includes('/blob/')) {
                cleanUrl = cleanUrl.replace('github.com', 'raw.githubusercontent.com')
                                   .replace('/blob/', '/');
            }
            
            // 3. 移除 ?raw=true 等參數
            cleanUrl = cleanUrl.split('?')[0];

            // 4. 使用 wsrv.nl 進行 CDN 加速 + 智能縮圖
            return `https://wsrv.nl/?url=${encodeURIComponent(cleanUrl)}&w=${width}&q=80&output=webp`;
        }

        function renderTagCloud() {
            const tagBar = document.getElementById('tag-bar');
            if (!tagBar) return;
            const allTags = new Set();
            articles.forEach(a => {
                if (a.tags) String(a.tags).split(/[,，\s]+/).forEach(t => t.trim() && allTags.add(t.trim()));
            });
            let html = `<button onclick="filterByTag(null)" class="tag-pill px-4 py-1.5 rounded-xl text-[11px] font-bold border border-slate-200 ${!selectedTag ? 'active' : 'bg-slate-50 text-slate-500'}">全部</button>`;
            allTags.forEach(tag => {
                html += `<button onclick="filterByTag('${tag}')" class="tag-pill px-4 py-1.5 rounded-xl text-[11px] font-bold border border-slate-200 ${selectedTag === tag ? 'active' : 'bg-slate-50 text-slate-500'}"># ${tag}</button>`;
            });
            tagBar.innerHTML = html;
        }

        function filterByTag(tag) {
            selectedTag = tag;
            renderTagCloud();
            const filtered = tag ? articles.filter(a => String(a.tags).includes(tag)) : articles;
            renderHome(filtered);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function debouncedSearch(val) {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => handleSearch(val), 250);
        }

        function handleSearch(val) {
            const q = String(val || "").trim().toLowerCase();
            isSearching = !!q;
            selectedTag = null; 
            renderTagCloud();
            if (!isSearching) { renderHome(); return; }
            const filtered = articles.filter(a => (String(a.title)+String(a.summary)+String(a.content)+String(a.tags)).toLowerCase().includes(q));
            renderHome(filtered);
        }

        function resetAndHome() {
            document.title = "Daily Science | 科普小站";
            document.getElementById('search-input').value = '';
            
            const root = document.getElementById('app-root');
            root.classList.remove('full-width-mode', 'article-mode');
            document.getElementById('main-nav').style.transform = 'translateY(0)';
            document.getElementById('main-footer').style.display = 'block';
            
            isSearching = false;
            selectedTag = null;
            renderHome();
            renderTagCloud();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderHome(data = articles) {
            const root = document.getElementById('app-root');
            root.classList.remove('article-mode');
            let html = (isSearching || selectedTag) ? `<div class="mb-8 text-slate-400 font-bold fade-in flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i> 找到 ${data.length} 篇相關文章</div>` : '';
            html += `<div class="grid gap-10 md:grid-cols-2 lg:grid-cols-3 fade-in">`;
            data.forEach(art => {
                // 列表頁使用 600px 寬度的縮圖，大幅提升載入速度
                const optimizedImg = optimizeImageUrl(art.image, 600);
                const img = optimizedImg ? `<img src="${optimizedImg}" class="w-full h-full object-cover group-hover:scale-110 transition duration-1000" loading="lazy" decoding="async">` : `<div class="w-full h-full flex items-center justify-center bg-slate-100 text-slate-300 font-black text-xs tracking-widest text-center px-4 uppercase">Scientific Insight</div>`;
                html += `
                <div onclick="renderArticle('${art.id}')" class="article-card bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden cursor-pointer group text-left">
                    <div class="relative aspect-video overflow-hidden bg-slate-50">${img}</div>
                    <div class="p-8">
                        <div class="text-[10px] text-indigo-600 font-black mb-3 tracking-widest uppercase opacity-70">${art.date || ''}</div>
                        <h2 class="text-xl font-black text-slate-800 line-clamp-2 leading-tight group-hover:text-indigo-600 transition-colors">${art.title || '無標題'}</h2>
                        <p class="text-slate-500 text-sm mt-4 line-clamp-2">${art.summary || '點擊閱讀全文內容...'}</p>
                    </div>
                </div>`;
            });
            html += `</div>`;
            root.innerHTML = html;
            if(window.lucide) lucide.createIcons();
        }

        async function renderArticle(id) {
            const art = articles.find(a => String(a.id) === String(id));
            if (!art) return;
            
            document.title = `${art.title} | Daily Science`;
            const root = document.getElementById('app-root');
            root.classList.add('article-mode');
            document.getElementById('main-footer').style.display = 'none';
            
            window.scrollTo({ top: 0, behavior: 'instant' });

            const isFullHtml = art.content.toLowerCase().includes('<html') || art.content.toLowerCase().includes('<!doctype');

            if (isFullHtml) {
                root.classList.add('full-width-mode');
                document.getElementById('main-nav').style.transform = 'translateY(-100%)';

                root.innerHTML = `
                    <div class="fixed top-4 right-4 z-[9999] flex gap-2 group">
                         <button onclick="copyShare('${art.title}')" class="p-3 rounded-full bg-white/10 backdrop-blur text-slate-800 hover:bg-white hover:text-indigo-600 shadow-lg transition-all border border-white/20" title="分享"><i data-lucide="share-2" class="w-5 h-5"></i></button>
                        <button onclick="resetAndHome()" class="p-3 rounded-full bg-slate-900 text-white shadow-lg hover:scale-110 transition-all border border-white/20"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <iframe id="content-frame" class="isolated-frame fade-in"></iframe>
                `;
                
                const frame = document.getElementById('content-frame');
                const doc = frame.contentWindow.document;
                doc.open();
                doc.write(art.content);
                doc.close();
                
                frame.onload = function() {
                    const height = frame.contentWindow.document.body.scrollHeight;
                     if(height > 0) frame.style.height = Math.max(height, window.innerHeight) + 'px';
                };

            } else {
                root.classList.remove('full-width-mode');
                document.getElementById('main-nav').style.transform = 'translateY(0)';

                const textContent = String(art.content).replace(/<[^>]*>/g, '');
                const readTime = Math.max(1, Math.round(textContent.length / 400));
                // 內頁使用 1200px 較高解析度圖片
                const optimizedImg = optimizeImageUrl(art.image, 1200);
                
                root.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white p-6 md:p-16 lg:p-24 rounded-[4rem] shadow-2xl border border-slate-100 fade-in relative mb-20 text-left">
                    <div class="flex justify-between items-center mb-12">
                        <button onclick="resetAndHome()" class="text-slate-400 hover:text-indigo-600 flex items-center font-bold transition group">
                            <i data-lucide="arrow-left" class="w-5 h-5 mr-2 group-hover:-translate-x-2 transition-transform"></i> 返回首頁
                        </button>
                        <button onclick="copyShare('${art.title}')" class="p-3 rounded-full bg-slate-50 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-all" title="分享">
                            <i data-lucide="share-2" class="w-6 h-6"></i>
                        </button>
                    </div>
                    <article class="prose prose-slate prose-lg lg:prose-xl">
                        <div class="flex flex-wrap items-center gap-4 mb-6 text-[11px] font-black uppercase tracking-widest text-indigo-500">
                            <span class="bg-indigo-50 px-2.5 py-1 rounded-lg">${art.date}</span>
                            <span class="flex items-center gap-1.5 text-slate-400 font-bold"><i data-lucide="clock" class="w-4 h-4"></i> 約需 ${readTime} 分鐘</span>
                        </div>
                        <h1 class="text-slate-900 leading-tight mb-10">${art.title}</h1>
                        ${optimizedImg ? `<img src="${optimizedImg}" class="w-full shadow-2xl mb-12" loading="eager">` : ''}
                        <div class="article-content text-slate-700 font-medium">${art.content}</div>
                    </article>
                    <div class="mt-24 pt-12 border-t border-slate-100 text-center text-slate-300 font-black tracking-widest text-xs uppercase">End of Content</div>
                </div>`;
                
                setTimeout(() => { executeScripts(root); }, 300); 
            }
            
            setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 200);
        }

        function setupScrollEvents() {
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
                document.getElementById("progress-bar").style.width = scrolled + "%";

                const btt = document.getElementById('back-to-top');
                if (winScroll > 300) btt.classList.add('show');
                else btt.classList.remove('show');
            });
        }

        // [分享功能優化] 包含標題、網址與搜尋引導
        function copyShare(title) {
            // 組合分享文案
            const text = `嘿！推薦你閱讀這篇科普文章：【${title}】\n🔗 ${SITE_URL}\n(請點擊連結後搜尋標題)`;
            
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            
            const toast = document.createElement('div');
            toast.className = 'fixed top-24 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl z-[9999] text-sm font-bold flex items-center gap-3 fade-in';
            toast.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-green-400"></i> 分享內容已複製';
            document.body.appendChild(toast);
            if(window.lucide) lucide.createIcons();
            setTimeout(() => toast.remove(), 2500);
        }

        function executeScripts(container) {
            const scripts = Array.from(container.querySelectorAll('script'));
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.innerHTML = oldScript.innerHTML;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }
    </script>
</body>
</html>
